# Type checking for the Python backend: `npm run typecheck:py` (part of `npm run check` and CI).
[mypy]
python_version = 3.12
files = backend, server.py, api
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True

# Optional at runtime (used for its certificate bundle when installed); ships without type hints.
[mypy-certifi.*]
ignore_missing_imports = True
