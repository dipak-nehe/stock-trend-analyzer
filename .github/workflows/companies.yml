name: All companies list

# Rebuilds public/data/companies.json (every US-listed company SEC has a ticker for, with its exchange and industry,
# for companies.html) once a month and on demand, and commits it if the list changed. The commit deploys like any other
# push. Downloads SEC's ticker list, its SIC code list and up to four quarterly Financial Statement Data Sets (filer
# industry codes), about 200 MB in all. Needs the repository secret SEC_USER_AGENT (its email is also the commit author:
# Vercel only deploys the owner's commits). If a list looks wrong, the run fails and the previous file stays.
on:
  schedule:
    - cron: "0 8 5 * *"  # the 5th of every month, 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      # 1. Get the code (and the current list, to compare against).
      - uses: actions/checkout@v7

      # 2. Python for the builder (standard library only).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 3. SEC asks automated requests to name a contact.
      - name: Check the SEC contact secret is set
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Add the SEC_USER_AGENT repository secret, e.g. 'StockTrendAnalyzer you@example.com'."
            exit 1
          fi

      # 4. Read the lists and write public/data/companies.json.
      - name: Build the All companies list
        run: python scripts/build_companies.py

      # 5. Commit only when the companies changed (not just the date it was built).
      - name: Commit it if it changed
        run: |
          python - <<'EOF'
          import json, subprocess
          new = json.load(open("public/data/companies.json"))
          old = json.loads(subprocess.run(["git", "show", "HEAD:public/data/companies.json"], capture_output=True, text=True).stdout or "{}")
          same = {k: v for k, v in new.items() if k != "generated"} == {k: v for k, v in old.items() if k != "generated"}
          open("unchanged", "w").write("yes" if same else "")
          EOF
          if [ -s unchanged ]; then echo "Company list unchanged"; exit 0; fi
          git config user.name "dipak-nehe"
          git config user.email "${SEC_USER_AGENT##* }"
          git add public/data/companies.json
          git commit -m "Monthly company list refresh"
          git push
