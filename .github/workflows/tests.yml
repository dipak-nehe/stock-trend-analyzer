name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Optional: a Vercel token (repo Settings → Secrets and variables → Actions → VERCEL_TOKEN) publishes the
      # Allure report to its own Vercel site on every push to main. Without it, the report is still
      # available as a downloadable artifact.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install test tools
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          npm ci

      # Each test step runs even if an earlier one failed, so the report always covers every layer.
      - name: JavaScript unit tests
        run: npm run test:js:allure

      - name: Unit, regression and HTTP tests
        if: success() || failure()
        run: pytest -m "not e2e" -v --alluredir=allure-results

      - name: End-to-end and accessibility tests
        if: success() || failure()
        run: pytest tests/e2e -v --alluredir=allure-results --tracing retain-on-failure --output test-results

      - name: Build the Allure report
        if: always()
        run: npm run report

      - name: Upload the Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/

      - name: Publish the report to Vercel
        id: publish
        if: always() && github.ref == 'refs/heads/main' && env.VERCEL_TOKEN != ''
        continue-on-error: true   # a publishing problem shouldn't mark the tests as failed
        run: |
          # Check the token first, so a bad one gets a clear message (the token itself is never printed).
          who=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user)
          user=$(echo "$who" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("user",{}).get("username",""))')
          if [ -z "$user" ]; then
            projects=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects?limit=1")
            if [ "$projects" = "200" ]; then
              echo "::error title=Vercel token is limited to specific projects::It can't create the separate report site. Create a token with access to your whole account (not specific projects) at vercel.com/account/settings/tokens and update the VERCEL_TOKEN secret."
            else
              echo "::error title=Vercel token rejected::Create a new token at vercel.com/account/settings/tokens and update the VERCEL_TOKEN secret."
            fi
            exit 1
          fi
          echo "Vercel token OK (account: $user)"
          mkdir -p site/stock-trend-test-report
          cp allure-report/index.html site/stock-trend-test-report/
          cd site/stock-trend-test-report
          if ! npx --yes vercel@60.1.3 deploy --prod --yes --token "$VERCEL_TOKEN" > ../deploy-url.txt 2> ../deploy.log; then
            cat ../deploy.log; exit 1
          fi
          # Prefer the stable production address (e.g. https://stock-trend-test-report.vercel.app).
          alias=$(grep -Eo 'Aliased: https://[^ ]+' ../deploy.log | head -1 | cut -d' ' -f2)
          url="${alias:-$(cat ../deploy-url.txt)}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Allure report::$url"

      - name: Test summary
        if: always()
        env:
          REPORT_URL: ${{ steps.publish.outputs.url }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          try:
              stats = json.load(open("allure-report/summary.json"))["stats"]
          except Exception:
              stats = {}
          total, passed = stats.get("total", 0), stats.get("passed", 0)
          other = ", ".join(f"{v} {k}" for k, v in stats.items() if k not in ("total", "passed") and v)
          print("## Test results")
          print(f"**{passed} of {total} passed**" + (f" · {other}" if other else ""))
          print()
          if os.environ.get("REPORT_URL"):
              print(f"📊 **Allure report:** {os.environ['REPORT_URL']}")
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}#artifacts"
          print(f"📦 **Download:** [allure-report]({run}), a single index.html that opens in any browser")
          EOF
