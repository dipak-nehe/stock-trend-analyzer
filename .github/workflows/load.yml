# k6 load tests, users ramp 5 → 10 → 15 and down:
#   api: load/ramp.js, plain HTTP visitors plus paced first lookups on the live site
#   ui:  load/ui-ramp.js, real headless Chromium users searching a ticker and checking the company heading
# Runs only when started by hand (Actions → load test → Run workflow), never on a push, a deployment or a schedule.
name: load test

on:
  workflow_dispatch:
    inputs:
      test:
        description: "Which load test: api (HTTP requests) or ui (real browsers)"
        type: choice
        options: [api, ui]
        default: api
      target:
        description: "Where to run it"
        type: choice
        options: [live, local]
        default: live
      bypass_cdn:
        description: "API test, live: skip Vercel's CDN so every request runs the Python function and reads Redis"
        type: boolean
        default: true
      first_lookups:
        description: "API test, live: include the first-lookups scenario (companies fetched from SEC, one every 12 s)"
        type: boolean
        default: true
      levels:
        description: "User levels to ramp through, comma-separated (each is held one step, then ramp down)"
        default: "5,10,15"
      step:
        description: "Length of each ramp and hold step"
        default: "1m"

# Only one load test at a time: a second run waits instead of adding its load on top of the first.
concurrency:
  group: load-test
  cancel-in-progress: false

# Read-only access to the repository is all this workflow needs.
permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The form's choices become environment variables, which the k6 scripts read (__ENV). Defaults apply when a
    # field is left as it is.
    env:
      SCRIPT: ${{ inputs.test == 'ui' && 'load/ui-ramp.js' || 'load/ramp.js' }}
      TARGET: ${{ github.event.inputs.target || 'live' }}
      BYPASS_CDN: ${{ (github.event.inputs.bypass_cdn || 'true') == 'true' && '1' || '0' }}
      FIRST_LOOKUPS: ${{ (github.event.inputs.first_lookups || 'true') == 'true' && '1' || '0' }}
      STEP: ${{ github.event.inputs.step || '1m' }}
      LEVELS: ${{ github.event.inputs.levels || '5,10,15' }}
      # Save k6's dashboard as one HTML file (K6_WEB_DASHBOARD_EXPORT) for the k6-report artifact.
      K6_WEB_DASHBOARD: "true"
      # Ubuntu on GitHub's runners blocks Chrome's sandbox for normal users, and Chromium then crashes at start
      # (seen as "signal: aborted (core dumped)"); the runner is a throwaway VM, so turning it off is safe here.
      K6_BROWSER_ARGS: no-sandbox
      K6_WEB_DASHBOARD_EXPORT: load/report.html
    steps:
      # 1. Get the repository's code (the branch picked in the "Run workflow" form).
      - name: Check out the code
        uses: actions/checkout@v7

      # 2. Install k6 (Grafana's official setup action). Chrome for the browser test is already on the runner.
      - name: Install k6
        uses: grafana/setup-k6-action@v1

      # 3. Local target only: Python for the test server (tests/e2e_server.py, standard library only).
      - name: Set up Python
        uses: actions/setup-python@v7
        if: env.TARGET == 'local'
        with:
          python-version: "3.12"

      # 4a. Local target: load/run-local.sh starts the test server on the saved filings, runs k6 and stops the
      #     server. tee keeps a copy of the output for the checks below.
      - name: Run against the local test server (saved filings, no SEC calls)
        if: env.TARGET == 'local'
        run: sh load/run-local.sh | tee load/summary.txt

      # 4b. Live target: run k6 straight against the public site (the scripts warm up their tickers first).
      - name: Run against the live site
        if: env.TARGET == 'live'
        run: k6 run "$SCRIPT" | tee load/summary.txt
        env:
          BASE_URL: https://stock-value-analysis.vercel.app

      # 5. k6 can end "successfully" without having measured anything (a crashed browser leaves no samples, and
      # thresholds with no samples pass), so fail the run unless at least one check was completed.
      - name: Fail if nothing was measured
        run: |
          grep -qE "checks_succeeded\.+: +[0-9.]+% +[1-9][0-9]* out of" load/summary.txt \
            || { echo "::error::k6 finished without completing any checks"; exit 1; }

      # 6. Put the options used and the pass/fail limits on the run's summary page, even if the run failed.
      - name: Summary
        if: always()
        run: |
          {
            echo "## Load test: $SCRIPT on $TARGET (levels $LEVELS, step $STEP, CDN bypassed: $BYPASS_CDN, first lookups: $FIRST_LOOKUPS)"
            echo '```'
            sed -n '/THRESHOLDS/,/NETWORK/p' load/summary.txt 2>/dev/null || true
            echo '```'
            echo "Full HTML report: the **k6-report** artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      # 7. Keep k6's HTML report (charts of users, response times and errors over the run) as the k6-report artifact.
      - name: Upload the k6 report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k6-report
          path: load/report.html
          if-no-files-found: ignore
