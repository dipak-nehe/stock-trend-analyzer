# Playwright end-to-end and accessibility tests, run by hand.
#
# How to run: GitHub → Actions → "e2e tests (manual)" → Run workflow → pick the options → Run workflow.
# The results show on the run's summary page; the full Allure report (screenshots of each step, a video of every
# test) and Playwright's own report are downloadable at the bottom of that page under "Artifacts".
#
# The tests run against the real Python server on saved SEC filings (tests/e2e_server.py), exactly like the
# "tests" workflow that runs on every push, so they never call SEC or touch the live site.
name: e2e tests (manual)

on:
  # Only started by hand: no push, pull request, deployment or schedule triggers.
  workflow_dispatch:
    inputs:
      suite:
        description: "Which tests to run"
        type: choice
        options:
          - all              # every browser test
          - ui               # e2e/ui.spec.ts: the analysis page
          - compare          # e2e/compare.spec.ts: the compare page
          - accessibility    # e2e/accessibility.spec.ts: axe-core and keyboard checks
        default: all
      grep:
        description: "Only tests whose name contains this text (optional, e.g. Spanish)"
        required: false
        default: ""
      repeat_each:
        description: "Run each test this many times (to check a flaky test)"
        required: false
        default: "1"

# Read-only access to the repository is all this workflow needs.
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The choices are passed as environment variables, never pasted into shell commands directly, so text
      # typed into the form can't run as a command.
      SUITE: ${{ inputs.suite }}
      GREP: ${{ inputs.grep }}
      REPEAT_EACH: ${{ inputs.repeat_each }}
    steps:
      # 1. Get the repository's code (the branch picked in the "Run workflow" form).
      - name: Check out the code
        uses: actions/checkout@v7

      # 2. Python for the test server (tests/e2e_server.py), which Playwright starts before the tests.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 3. Node for Playwright and the Allure report generator.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # 4. Install the pinned test tools: Python packages, npm packages (exact versions from package-lock.json),
      #    and the Chromium browser with the system libraries it needs.
      - name: Install test tools
        run: |
          pip install -r requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium

      # 5. Run the chosen tests. Turns the form's choices into Playwright arguments: a spec file for the suite,
      #    --grep for the name filter, --repeat-each for repeats. Playwright starts the test server itself
      #    (webServer in playwright.config.ts).
      - name: Run the browser tests
        run: |
          args=""
          case "$SUITE" in
            ui) args="e2e/ui.spec.ts" ;;
            compare) args="e2e/compare.spec.ts" ;;
            accessibility) args="e2e/accessibility.spec.ts" ;;
          esac
          set -- $args
          [ -n "$GREP" ] && set -- "$@" --grep "$GREP"
          set -- "$@" --repeat-each "${REPEAT_EACH:-1}"
          echo "npx playwright test $*"
          npx playwright test "$@"

      # 6. Build the Allure report from the results, even if tests failed (that's when it's most useful).
      - name: Build the Allure report
        if: always()
        run: npm run report

      # 7. Put the pass/fail count and the options used on the run's summary page.
      - name: Test summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          try:
              stats = json.load(open("allure-report/summary.json"))["stats"]
          except Exception:
              stats = {}
          total, passed = stats.get("total", 0), stats.get("passed", 0)
          other = ", ".join(f"{v} {k}" for k, v in stats.items() if k not in ("total", "passed") and v)
          print("## e2e tests (manual)")
          print(f"Suite: **{os.environ['SUITE']}** · name filter: **{os.environ['GREP'] or 'none'}** · "
                f"repeat each: **{os.environ['REPEAT_EACH']}**")
          print()
          print(f"**{passed} of {total} passed**" + (f" · {other}" if other else ""))
          print()
          print("Download **allure-report** below and open `index.html` for step screenshots and videos.")
          EOF

      # 8. Keep the Allure report (one HTML file: open index.html) for 14 days.
      - name: Upload the Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      # 9. On failure, also keep Playwright's HTML report and traces (open a trace at trace.playwright.dev to
      #    step through the failing test).
      - name: Upload the Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
